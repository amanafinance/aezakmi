const apiKey = ""; 

const callGemini = async (prompt, systemPrompt = "") => {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
  
  const payload = {
    contents: [{ parts: [{ text: prompt }] }],
  };
  
  if (systemPrompt) {
    payload.systemInstruction = { parts: [{ text: systemPrompt }] };
  }

  for (let attempt = 0; attempt < 5; attempt++) {
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      if (!res.ok) throw new Error(`HTTP error ${res.status}`);
      const data = await res.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || "Нет ответа от ИИ.";
    } catch (err) {
      if (attempt === 4) throw err;
      await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
    }
  }
};

    { id: 'paral', name: 'Параллелограмм', type: 'trapezoid', w1: 10, w2: 10, h: 6, icon: (props) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polygon points="4,20 16,20 20,6 8,6" /></svg> },

/**
 * ==========================================================================================
 * 3. MODULE: MATH UTILS
 * ==========================================================================================
 */
const MathUtils = {
  getYOnSegment: (x, p1, p2) => {
      const minX = Math.min(p1.x, p2.x);
      const maxX = Math.max(p1.x, p2.x);
      if (x < minX || x > maxX) return null; 
      if (Math.abs(p1.x - p2.x) < 0.001) return null; 
      const t = (x - p1.x) / (p2.x - p1.x);
      return p1.y + t * (p2.y - p1.y);
  },

  getRangeAt: (x, slope) => {
      if (!slope || !slope.points || slope.points.length < 3) return null;
      const intersections = [];
      const pts = slope.points;
      for (let i = 0; i < pts.length; i++) {
          const p1 = pts[i];
          const p2 = pts[(i + 1) % pts.length]; 
          const y = MathUtils.getYOnSegment(x, p1, p2);
          if (y !== null && !isNaN(y)) intersections.push(y);
      }
      if (intersections.length < 2) return null;
      intersections.sort((a, b) => a - b);
      return { minY: intersections[0], maxY: intersections[intersections.length - 1] };
  },

  generateTemplatePoints: (templateId, w1, w2, h, h2, offsetLeft = 0) => {
      switch (templateId) {
          case 'rect': return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h}, {x:0, y:h}];
          case 'tri': return [{x:0, y:0}, {x:w1, y:0}, {x:w1/2, y:h}];
          case 'tri_l': return [{x:0, y:0}, {x:w1, y:0}, {x:0, y:h}];
          case 'tri_r': return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h}];
          case 'trap': 
             const off = (w1 - w2) / 2;
             return [{x:0, y:0}, {x:w1, y:0}, {x:w1-off, y:h}, {x:off, y:h}];
          case 'trap_l': return [{x:0, y:0}, {x:w1, y:0}, {x:w2, y:h}, {x:0, y:h}]; 
          case 'trap_r': return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h}, {x:w1-w2, y:h}]; 
          case 'paral_l': return [{x:0, y:0}, {x:w1, y:0}, {x:w1+3, y:h}, {x:3, y:h}]; 
          case 'paral_r': return [{x:3, y:0}, {x:w1+3, y:0}, {x:w1, y:h}, {x:0, y:h}];
          case 'rhomb': return [{x:w1/2, y:0}, {x:w1, y:h/2}, {x:w1/2, y:h}, {x:0, y:h/2}];
          case 'rect_cut_br': return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h-h2}, {x:w1-w2, y:h-h2}, {x:w1-w2, y:h}, {x:0, y:h}];
          case 'l_shape_tl': return [{x:0, y:0}, {x:w2, y:0}, {x:w2, y:h-h2}, {x:w1, y:h-h2}, {x:w1, y:h}, {x:0, y:h}];
          case 't_shape': 
              const stemX = (w1 - w2)/2;
              return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h2}, {x:stemX+w2, y:h2}, {x:stemX+w2, y:h}, {x:stemX, y:h}, {x:stemX, y:h2}, {x:0, y:h2}];
          case 'house': return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h2}, {x:w1/2, y:h}, {x:0, y:h2}];
          case 'cut_tl': return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h}, {x:w2, y:h}, {x:0, y:h-h2}];
          case 'cut_tr': return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h-h2}, {x:w1-w2, y:h}, {x:0, y:h}];
          default: return [{x:0, y:0}, {x:w1, y:0}, {x:w1, y:h}, {x:0, y:h}];
      }
  },

  checkAndFixDeadZone: (len, deadZones) => {
    let fixed = false;
    let val = len;
    if (!deadZones || deadZones.length === 0) return { val, fixed };
    
    for (const [start, end] of deadZones) {
        if (val >= start && val <= end) {
            val = end + 0.05; 
            fixed = true;
            break;
        }
    }
    return { val, fixed };
  },

  calculateSlope: (slope, material, globalSettings) => {
    if (!slope || !slope.points || slope.points.length < 3 || !material || !globalSettings) return [];
    
    const xs = slope.points.map(p => p.x);
    const minX = Math.min(...xs);
    const maxX = Math.max(...xs);
    const width = maxX - minX;

    const effW = material.effectiveWidth || material.effective;
    if (!effW || isNaN(effW)) return [];

    const waveStep = globalSettings.waveLength || 0.35; 
    const maxLen = globalSettings.lMax || 8.0;  
    const splitOverlap = globalSettings.lockOverlap || 0.15;
    
    const deadZones = globalSettings.customDeadZones && globalSettings.customDeadZones.length > 0 
        ? globalSettings.customDeadZones 
        : (material.deadZones || []);
    
    const useDeadZones = globalSettings.useDeadZones;

    const { sheetOverrides = {}, layout = { mode: 'start', offset: 0 } } = slope;

    const totalCols = Math.ceil(width / effW);
    if (isNaN(totalCols) || totalCols < 0) return [];
    
    let startX = minX; 
    if (layout.mode === 'center') startX = minX + (width - (totalCols * effW)) / 2;
    else if (layout.mode === 'end') startX = minX + width - (totalCols * effW);
    
    startX += (layout.offset || 0) / 100;
    const overhang = slope.overhang || 0;

    let globalMaxLen = 0;
    const columnsData = [];

    for (let i = -2; i <= totalCols + 2; i++) { 
      const xStart = startX + i * effW;
      const xEnd = xStart + effW;
      const xMid = (xStart + xEnd) / 2;

      if (xEnd < minX || xStart > maxX) continue;

      const r1 = MathUtils.getRangeAt(xStart + 0.01, slope);
      const r2 = MathUtils.getRangeAt(xMid, slope);
      const r3 = MathUtils.getRangeAt(xEnd - 0.01, slope);
      
      if (!r1 && !r2 && !r3) continue;

      const valids = [r1, r2, r3].filter(r => r !== null && !isNaN(r.minY) && !isNaN(r.maxY));
      if (valids.length === 0) continue;

      const geomMinY = Math.min(...valids.map(r => r.minY));
      const geomMaxY = Math.max(...valids.map(r => r.maxY));
      
      const reqLen = (geomMaxY - geomMinY) + overhang;
      const yBase = geomMinY - overhang;

      if (reqLen < 0.1 || isNaN(reqLen)) continue;

      let calculatedLen = reqLen;
      if (material.category === 'metal') {
          const rawLen = reqLen + 0.05; 
          const steps = Math.ceil(rawLen / waveStep);
          calculatedLen = steps * waveStep;
      }
      
      globalMaxLen = Math.max(globalMaxLen, calculatedLen);

      columnsData.push({
          i,
          xStart,
          yBase,
          calculatedLen,
          reqLen
      });
    }

    const sheets = [];

    columnsData.forEach(col => {
        const { i, xStart, yBase, calculatedLen, reqLen } = col;
        const sheetsInColumn = [];

        if (calculatedLen > maxLen) {
            const totalNeeded = calculatedLen + splitOverlap;
            let bottomLenRaw = totalNeeded / 2;
            let bottomLen = bottomLenRaw;
            if (material.category === 'metal') {
                bottomLen = Math.ceil(bottomLenRaw / waveStep) * waveStep;
            }

            let bottomIsFixed = false;
            if (useDeadZones) {
                const check = MathUtils.checkAndFixDeadZone(bottomLen, deadZones);
                if (check.fixed) {
                    bottomLen = check.val;
                    bottomIsFixed = true;
                    if (material.category === 'metal') {
                        bottomLen = Math.ceil(bottomLen / waveStep) * waveStep;
                    }
                }
            }

            let topLenRaw = totalNeeded - bottomLen;
            let topLen = topLenRaw;
             if (material.category === 'metal') {
                topLen = Math.ceil(topLenRaw / waveStep) * waveStep;
            }

            let topIsFixed = false;
            if (useDeadZones) {
                 const checkTop = MathUtils.checkAndFixDeadZone(topLen, deadZones);
                 if (checkTop.fixed) {
                     topLen = checkTop.val;
                     topIsFixed = true;
                     if (material.category === 'metal') {
                         topLen = Math.ceil(topLen / waveStep) * waveStep;
                     }
                 }
            }
            sheetsInColumn.push({ len: bottomLen, offset: 0, warn: bottomIsFixed });
            sheetsInColumn.push({ len: topLen, offset: bottomLen - splitOverlap, warn: topIsFixed });
        } else {
            let finalLen = calculatedLen;
            let isWarning = false;
            if (useDeadZones) {
                const check = MathUtils.checkAndFixDeadZone(finalLen, deadZones);
                if (check.fixed) {
                     finalLen = check.val;
                     isWarning = true;
                     if (material.category === 'metal') {
                        finalLen = Math.ceil(finalLen / waveStep) * waveStep;
                    }
                }
            }
            sheetsInColumn.push({ len: finalLen, offset: 0, warn: isWarning });
        }

        sheetsInColumn.forEach((part, subIdx) => {
            const sheetId = `${slope.id}-${i}-${subIdx}`;
            const override = sheetOverrides[sheetId] || {};

            if (override.deleted) return;

            const finalLen = override.length !== undefined ? override.length : part.len;
            const finalOffset = override.offset !== undefined ? override.offset : part.offset;
            const isManual = override.length !== undefined || override.offset !== undefined;
            const isNarrow = finalLen < 0.2; 

            if (isNaN(finalLen)) return;

            sheets.push({
              id: sheetId,
              index: i, subIndex: subIdx,
              x: xStart, yBase: yBase, 
              len: finalLen, bottomOffset: finalOffset, 
              realLen: reqLen, 
              isCut: (!isManual) && (sheetsInColumn.length > 1) && (subIdx === sheetsInColumn.length - 1), 
              isDeadZoneFix: part.warn && !isManual,
              isNarrow: isNarrow, isManual: isManual
            });
        });
    });

    return sheets;
  },

  getSides: (slope) => {
      const { w1, w2, h, offsetLeft } = slope;
      if (!h) return { sideL: 0, sideR: 0 };
      const sideL = Math.sqrt(Math.pow(h, 2) + Math.pow(offsetLeft, 2));
      const rightBase = Math.abs(w1 - w2 - offsetLeft);
      const sideR = Math.sqrt(Math.pow(h, 2) + Math.pow(rightBase, 2));
      return { sideL, sideR };
  }
};

const DebouncedInput = ({ value, onChange, className, type = "text", ...props }) => {
  const [localValue, setLocalValue] = useState(value === undefined ? '' : value);
  useEffect(() => { setLocalValue(value === undefined ? '' : value); }, [value]);
  const handleChange = (e) => { setLocalValue(e.target.value); };
  const handleBlur = () => { onChange(localValue); };
  const handleKeyDown = (e) => { if (e.key === 'Enter') { onChange(localValue); e.target.blur(); } };
  return <input type={type} className={className} value={localValue} onChange={handleChange} onBlur={handleBlur} onKeyDown={handleKeyDown} {...props} />;
};

                value={value}

                {...props}
            />
            {suffix && <span className="absolute right-3 text-xs font-medium text-slate-400 pointer-events-none">{suffix}</span>}
        </div>
    </div>
);

/**
 * ==========================================================================================
 * 5. WORKSPACE COMPONENT
 * ==========================================================================================
 */
const Workspace = React.memo(({ 
  activeS, sheets, material, zoom, setZoom, updateSlopeGeometry, handleUpdateSheetOverride, projectInfo, onAskAI, onCanvasClick, onFinishDrawing, onCancelDrawing, globalSettings
}) => {
  const [draggingPointIdx, setDraggingPointIdx] = useState(null);
  const [selectedSheetIds, setSelectedSheetIds] = useState(new Set());
  const [editLengthValue, setEditLengthValue] = useState("");
  const [mouseCoords, setMouseCoords] = useState({ x: 0, y: 0 });

  const svgRef = useRef(null);
  const scrollContainerRef = useRef(null);

  // Define offsetLimit inside Workspace
  const offsetLimit = Math.floor((material.effectiveWidth || 1) * 100);

  useEffect(() => { 
      setSelectedSheetIds(new Set()); 
      setEditLengthValue("");
  }, [activeS?.id]);

  const selectedSheets = useMemo(() => {
      return sheets.filter(s => selectedSheetIds.has(s.id));
  }, [sheets, selectedSheetIds]);

  useEffect(() => {
      if (selectedSheets.length === 1) {
          setEditLengthValue(selectedSheets[0].len.toFixed(3));
      } else if (selectedSheets.length > 1) {
          const firstLen = selectedSheets[0].len;
          const allSame = selectedSheets.every(s => Math.abs(s.len - firstLen) < 0.001);
          setEditLengthValue(allSame ? firstLen.toFixed(3) : "");
      }
  }, [selectedSheetIds, sheets]); 

  useEffect(() => {
      if (scrollContainerRef.current && activeS && activeS.points && activeS.points.length > 0) {
          const scale = VIEWBOX_CONFIG.baseScale * zoom;
          const canvasHeightPx = VIRTUAL_CANVAS_METERS.height * scale;
          const originX = 60 * zoom; 
          const originY = canvasHeightPx - (40 * zoom);
          const centerX = (Math.min(...activeS.points.map(p => originX + (p.x * scale))) + Math.max(...activeS.points.map(p => originX + (p.x * scale)))) / 2;
          const centerY = (Math.min(...activeS.points.map(p => originY - (p.y * scale))) + Math.max(...activeS.points.map(p => originY - (p.y * scale)))) / 2;
          const container = scrollContainerRef.current;
          container.scrollTo({
              left: centerX - container.clientWidth / 2,
              top: centerY - container.clientHeight / 2,
              behavior: 'smooth'
          });
      }
  }, [activeS?.id, zoom]); 

  const scale = VIEWBOX_CONFIG.baseScale * zoom;
  const canvasWidthPx = VIRTUAL_CANVAS_METERS.width * scale;
  const canvasHeightPx = VIRTUAL_CANVAS_METERS.height * scale;
  
  const originX = 60 * zoom; 
  const originY = canvasHeightPx - (40 * zoom);

  const toScreenX = (val) => originX + (val * scale);
  const toScreenY = (val) => originY - (val * scale); 
  const fromScreenX = (val) => (val - originX) / scale;
  const fromScreenY = (val) => (originY - val) / scale;

  const isDrawing = activeS?.templateId === 'custom_draw';
  const points = activeS?.points || [];

  const handleMouseMove = (e) => {
      if (!svgRef.current) return;
      const pt = svgRef.current.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      const svgP = pt.matrixTransform(svgRef.current.getScreenCTM().inverse());
      
      const rawX = fromScreenX(svgP.x);
      const rawY = fromScreenY(svgP.y);

      const snap = 0.01;
      const xMeter = draggingPointIdx !== null || isDrawing ? Math.round(rawX / snap) * snap : rawX;
      const yMeter = draggingPointIdx !== null || isDrawing ? Math.round(rawY / snap) * snap : rawY;
      
      setMouseCoords({ x: xMeter, y: yMeter });

      if (draggingPointIdx === null || !activeS?.points) return;
      const newPoints = [...activeS.points];
      newPoints[draggingPointIdx] = { x: xMeter, y: yMeter };
      updateSlopeGeometry(activeS?.id, { points: newPoints });
  };

  const handleBackgroundClick = (e) => {
      if (e.target.tagName === 'svg' || e.target.tagName === 'line' || e.target === scrollContainerRef.current) {
          if (!activeS || isDrawing) {
              if (onCanvasClick) onCanvasClick(mouseCoords.x, mouseCoords.y);
              return;
          }
      }
      setSelectedSheetIds(new Set());
  };

  const renderGrid = () => {
      const lines = [];
      const maxW = VIRTUAL_CANVAS_METERS.width;
      const maxH = VIRTUAL_CANVAS_METERS.height;
      for(let i=0; i<=maxW; i++) {
          const x = toScreenX(i);
          if (x > canvasWidthPx) break;
          lines.push(<line key={`v${i}`} x1={x} y1={originY} x2={x} y2={originY - maxH*scale} stroke="#94a3b8" strokeWidth="0.5" opacity="0.4" />);
          lines.push(<text key={`vl${i}`} x={x} y={originY + 20} textAnchor="middle" fontSize="10" fill="#475569" fontWeight="bold">{i}</text>);
      }
      for(let i=0; i<=maxH; i++) {
          const y = toScreenY(i);
          if (y < 0) break;
          lines.push(<line key={`h${i}`} x1={originX} y1={y} x2={originX + maxW*scale} y2={y} stroke="#94a3b8" strokeWidth="0.5" opacity="0.4" />);
          lines.push(<text key={`hl${i}`} x={originX - 10} y={y} dy="0.3em" textAnchor="end" fontSize="10" fill="#475569" fontWeight="bold">{i}</text>);
      }
      return lines;
  };

  const handleMouseUp = () => setDraggingPointIdx(null);

  const handleLineClick = (idx1, e) => {
      if (isDrawing || !activeS) return;
      e.stopPropagation();
      const p1 = activeS.points[idx1];
      const p2 = activeS.points[(idx1 + 1) % activeS.points.length];
      const newPoint = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const newPoints = [...activeS.points];
      newPoints.splice(idx1 + 1, 0, newPoint);
      updateSlopeGeometry(activeS?.id, { points: newPoints, templateId: 'custom' });
  };

  const handlePointDblClick = (idx, e) => {
      if (isDrawing || !activeS) return;
      e.stopPropagation();
      if (activeS.points.length <= 3) return; 
      const newPoints = activeS.points.filter((_, i) => i !== idx);
      updateSlopeGeometry(activeS?.id, { points: newPoints, templateId: 'custom' });
  };

  const handleSheetClick = (sheetId, e) => {
      if (isDrawing) return;
      e.stopPropagation();
      setSelectedSheetIds(prev => {
          const newSet = new Set(e.ctrlKey || e.metaKey ? prev : []);
          if (newSet.has(sheetId)) {
              newSet.delete(sheetId);
          } else {
              newSet.add(sheetId);
          }
          return newSet;
      });
  };

  const polyPoints = points.map(p => `${toScreenX(p.x)},${toScreenY(p.y)}`).join(' ');

  const slopeGeomArea = activeS ? (((activeS?.w1 || 0) + (activeS?.w2 || 0)) / 2) * ((activeS?.h || 0) + (activeS?.overhang || 0)) : 0;
  
  let perimeter = 0;
  if (points.length >= 2) {
      points.forEach((p, i) => {
          if (isDrawing && i === points.length - 1) return;
          const pNext = points[(i + 1) % points.length];
          perimeter += Math.sqrt(Math.pow(pNext.x - p.x, 2) + Math.pow(pNext.y - p.y, 2));
      });
  }

  let matAreaFull = 0, matAreaUseful = 0;
  sheets.forEach(sh => {
      matAreaFull += (sh.len || 0) * (material.total || 0);
      matAreaUseful += (sh.len || 0) * (material.effectiveWidth || 0);
  });
  const wastePercent = slopeGeomArea > 0 ? ((matAreaFull - slopeGeomArea) / slopeGeomArea) * 100 : 0;

  const updateSelectedSheets = (changes) => {
      if (!activeS) return;
      const idsToUpdate = Array.from(selectedSheetIds);
      handleUpdateSheetOverride(activeS?.id, idsToUpdate, changes);
  };
  
  const onLengthCommit = () => {
      const sanitizedValue = String(editLengthValue).replace(',', '.');
      const val = parseFloat(sanitizedValue);
      if (!isNaN(val) && val > 0) {
          updateSelectedSheets({ length: val });
      }
  };

  const handleLengthChange = (delta) => {
      const currentVal = parseFloat(String(editLengthValue).replace(',', '.')) || 0;
      const newVal = Math.max(0.1, currentVal + delta);
      setEditLengthValue(newVal.toFixed(3));
      updateSelectedSheets({ length: newVal });
  };

  const handleOffsetChange = (delta) => {
      if (!activeS) return;
      selectedSheets.forEach(s => {
          const currentOffset = s.bottomOffset || 0;
          const newOffset = currentOffset + delta;
          handleUpdateSheetOverride(activeS?.id, [s.id], { offset: newOffset });
      });
  };

  const onDeleteSelected = () => {
      updateSelectedSheets({ deleted: true });
      setSelectedSheetIds(new Set()); 
  };

  const onSplitSelected = () => {
      const val = parseFloat(String(editLengthValue).replace(',', '.'));
      if (!isNaN(val) && val > 0) {
          updateSelectedSheets({ length: val / 2 });
      }
  };

  const onAlignBottom = () => {
     updateSelectedSheets({ offset: 0 });
  };

  const onAlignTop = () => {
     if (!activeS) return;
     selectedSheets.forEach(s => {
         const newOffset = Math.max(0, s.realLen - s.len);
         handleUpdateSheetOverride(activeS?.id, [s.id], { offset: newOffset });
     });
  };

  const navigateSheet = (direction) => {
      if (selectedSheets.length !== 1) return;
      const currentSheet = selectedSheets[0];
      const currentIndex = sheets.findIndex(s => s.id === currentSheet.id);
      if (currentIndex === -1) return;
      
      let nextIndex = direction === 'prev' ? currentIndex - 1 : currentIndex + 1;
      if (nextIndex >= 0 && nextIndex < sheets.length) {
          setSelectedSheetIds(new Set([sheets[nextIndex].id]));
      }
  };

  if (!activeS || !activeS.points || (activeS.points.length < 3 && !isDrawing)) {
      return (
          <div className="flex-1 flex flex-col bg-slate-100 overflow-hidden relative select-none">
              <div className="flex-1 relative bg-[#cfd3d8] overflow-auto border-b border-slate-400 shadow-inner" onMouseMove={handleMouseMove} onClick={handleBackgroundClick}>
                  <div className="absolute top-4 left-4 bg-white/90 border border-slate-400 px-3 py-1.5 text-xs font-mono font-bold text-slate-700 shadow-sm z-10 pointer-events-none rounded">
                      X: {mouseCoords.x.toFixed(2)}м | Y: {mouseCoords.y.toFixed(2)}м
                  </div>
                  <svg ref={svgRef} width={canvasWidthPx} height={canvasHeightPx} viewBox={`0 0 ${canvasWidthPx} ${canvasHeightPx}`} style={{ minWidth: '100%', minHeight: '100%' }}>
                      {renderGrid()}
                      <line x1={originX} y1={originY} x2={originX + 1000 * scale} y2={originY} stroke="#334155" strokeWidth="1.5" />
                      <line x1={originX} y1={originY} x2={originX} y2={originY - 1000 * scale} stroke="#334155" strokeWidth="1.5" />
                      
                      {isDrawing && points.length > 0 && (
                          <React.Fragment>
                              <polyline points={polyPoints} fill="none" stroke="#ef4444" strokeWidth="2.5" pointerEvents="none" strokeDasharray="5,5" />
                              <line x1={toScreenX(points[points.length-1].x)} y1={toScreenY(points[points.length-1].y)} x2={toScreenX(mouseCoords.x)} y2={toScreenY(mouseCoords.y)} stroke="#ef4444" strokeWidth="2.5" strokeDasharray="5,5" opacity="0.6" pointerEvents="none" />
                              {points.map((p, i) => (
                                  <circle key={`pt-empty-${i}`} cx={toScreenX(p.x)} cy={toScreenY(p.y)} r={6} fill="white" stroke="#ef4444" strokeWidth="2" pointerEvents="none" />
                              ))}
                          </React.Fragment>
                      )}
                  </svg>
                  
                  {!isDrawing && (
                      <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none bg-white/40 backdrop-blur-[2px]">
                          <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center mb-4 border border-slate-300 shadow-lg">
                              <LayoutGrid className="w-6 h-6 text-indigo-500"/>
                          </div>
                          <h3 className="text-sm font-bold text-slate-800 mb-2 drop-shadow-md">Холст пуст</h3>
                          <p className="text-xs text-slate-600 font-bold px-5 py-2 bg-white/90 rounded-full shadow-sm border border-slate-200">Выберите шаблон слева или <b>кликните на сетку</b> для рисования</p>
                      </div>
                  )}

                  {isDrawing && (
                      <div className="absolute bottom-10 left-1/2 -translate-x-1/2 bg-white p-3 rounded-xl shadow-2xl border border-indigo-200 flex items-center gap-4 z-50">
                          <span className="text-sm font-bold text-slate-700">Режим рисования ({points.length} точек)</span>
                          {points.length >= 3 && (
                              <button onClick={onFinishDrawing} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 transition">
                                 Завершить фигуру
                              </button>
                          )}
                          <button onClick={onCancelDrawing} className="px-4 py-2 bg-rose-50 text-rose-600 rounded-lg text-xs font-bold hover:bg-rose-100 transition">
                             Отмена
                          </button>
                      </div>
                  )}

                  <div className="absolute top-4 right-4 ml-auto w-fit flex flex-col gap-1 bg-white border border-slate-300 rounded shadow-sm print:hidden pointer-events-auto">
                     <button onClick={() => setZoom(z => Math.min(3, z + 0.1))} className="p-1.5 hover:bg-slate-100"><ZoomIn className="w-4 h-4 text-slate-600"/></button>
                     <button onClick={() => setZoom(z => Math.max(0.2, z - 0.1))} className="p-1.5 hover:bg-slate-100 border-t border-slate-200"><ZoomOut className="w-4 h-4 text-slate-600"/></button>
                  </div>
              </div>
              
              <div className="bg-white border-t border-slate-300 p-2 text-[10px] font-sans text-slate-800 flex justify-between items-start shrink-0 z-50 relative shadow-[0_-4px_10px_rgba(0,0,0,0.05)] print:hidden">
                  <div className="flex flex-col gap-0.5 w-1/3 border-r border-slate-200 pr-2">
                      <div>Заказ №1301 от {new Date().toLocaleDateString('ru-RU')}</div>
                      <div className="font-bold">Lmax реальная/Lmax стандартная, м: {(globalSettings?.lMax || 0).toFixed(3)} / 8.200</div>
                  </div>
                  <div className="flex flex-col gap-0.5 w-1/3 border-r border-slate-200 px-2 text-slate-400 italic">Нет активного ската</div>
                  <div className="w-1/3 pl-2 flex flex-col justify-end h-full items-end text-slate-400">
                      <div className="text-xl font-bold tracking-widest opacity-20">RoofPro</div>
                  </div>
              </div>
          </div>
      );
  }

  return (
    <div className="flex-1 flex flex-col bg-white overflow-hidden relative select-none">
        
        <div className="absolute top-4 left-1/2 -translate-x-1/2 bg-white/90 backdrop-blur-md px-5 py-2 rounded-full text-[11px] font-bold text-slate-600 shadow-sm border border-slate-200 z-20 flex items-center gap-4 print:hidden pointer-events-none">
             <span className="flex items-center gap-1.5"><MousePointer2 className="w-3.5 h-3.5 text-indigo-500"/> Drag - двигать</span>
             <span className="w-1 h-1 rounded-full bg-slate-300"></span>
             <span className="flex items-center gap-1.5"><Plus className="w-3.5 h-3.5 text-emerald-500"/> Click линия - добавить</span>
             <span className="w-1 h-1 rounded-full bg-slate-300"></span>
             <span className="flex items-center gap-1.5"><Trash2 className="w-3.5 h-3.5 text-red-500"/> DblClick точка - удалить</span>
             <span className="w-1 h-1 rounded-full bg-slate-300"></span>
             <span className="flex items-center gap-1.5"><MousePointerClick className="w-3.5 h-3.5 text-blue-500"/> Ctrl+Click - выбор неск.</span>
        </div>

        {/* Floating Data Panel */}
        <div className="absolute top-4 left-4 flex flex-col gap-2 z-10 pointer-events-none">
            <div className="bg-white/90 backdrop-blur border border-slate-300 px-3 py-1.5 rounded-lg shadow-sm">
                <div className="text-xs font-mono font-bold text-slate-700">X: {mouseCoords.x.toFixed(2)}м | Y: {mouseCoords.y.toFixed(2)}м</div>
            </div>
            <div className="bg-white/90 backdrop-blur border border-slate-300 p-3 rounded-lg shadow-sm flex flex-col gap-1 min-w-[120px]">
                <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Данные ската</div>
                <div className="flex justify-between items-center text-xs font-medium text-slate-600"><span>S:</span> <span className="font-bold text-slate-800">{slopeGeomArea.toFixed(2)} м²</span></div>
                <div className="flex justify-between items-center text-xs font-medium text-slate-600"><span>P:</span> <span className="font-bold text-slate-800">{perimeter.toFixed(2)} м</span></div>
            </div>
        </div>

        <div ref={scrollContainerRef} className="flex-1 relative bg-[#cfd3d8] overflow-auto border-b border-slate-400 shadow-inner" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp} onClick={handleBackgroundClick}>

            <svg ref={svgRef} width={canvasWidthPx} height={canvasHeightPx} viewBox={`0 0 ${canvasWidthPx} ${canvasHeightPx}`} style={{ minWidth: '100%', minHeight: '100%' }}>
                {renderGrid()}
                <line x1={originX} y1={originY} x2={originX + 1000 * scale} y2={originY} stroke="#334155" strokeWidth="1.5" />
                <line x1={originX} y1={originY} x2={originX} y2={originY - 1000 * scale} stroke="#334155" strokeWidth="1.5" />
                
                {!isDrawing && sheets.map(sh => {
                    const isSelected = selectedSheetIds.has(sh.id);
                    const topOfSheetSlopeY = (sh.yBase || 0) + sh.bottomOffset + sh.len;
                    const yPos = toScreenY(topOfSheetSlopeY); 
                    const xPos = toScreenX(sh.x);
                    const width = (material.effective || 1) * scale;
                    const height = sh.len * scale;
                    return (
                        <g key={sh.id} onClick={(e) => handleSheetClick(sh.id, e)} className="transition-all duration-200">
                            <rect x={xPos} y={yPos} width={width} height={height} 
                                fill={isSelected ? "rgba(59, 130, 246, 0.4)" : "rgba(59, 130, 246, 0.1)"} 
                                stroke={sh.isDeadZoneFix ? "#ef4444" : isSelected ? "#2563eb" : "#334155"} 
                                strokeWidth={isSelected ? 2 : 1} 
                                style={{ cursor: 'pointer' }} 
                            />
                            {height > 20 && (
                                <text x={xPos + width/2} y={yPos + height/2} textAnchor="middle" dy="0.3em" fontSize="10" fill="#1e293b" fontWeight="bold">{sh.len.toFixed(3)}</text>
                            )}
                        </g>
                )})}
                
                {/* Polygon or Polyline for drawing */}
                {!isDrawing && points.length >= 3 && (
                    <React.Fragment>
                        <clipPath id="polyClip"><polygon points={polyPoints} /></clipPath>
                        <polygon points={polyPoints} fill="none" stroke="#ef4444" strokeWidth="2.5" pointerEvents="none"/>
                    </React.Fragment>
                )}
                {isDrawing && points.length > 0 && (
                    <React.Fragment>
                        <polyline points={polyPoints} fill="none" stroke="#2563eb" strokeWidth="2.5" pointerEvents="none" />
                        <line x1={toScreenX(points[points.length-1].x)} y1={toScreenY(points[points.length-1].y)} x2={toScreenX(mouseCoords.x)} y2={toScreenY(mouseCoords.y)} stroke="#2563eb" strokeWidth="2.5" strokeDasharray="5,5" opacity="0.6" pointerEvents="none" />
                        {points.map((p, i) => (
                            <circle 
                                key={`pt-empty-${i}`} 
                                cx={toScreenX(p.x)} 
                                cy={toScreenY(p.y)} 
                                r={6} 
                                fill="white" 
                                stroke={i === 0 ? "#16a34a" : "#2563eb"} 
                                strokeWidth="2" 
                                style={{cursor: i === 0 ? 'pointer' : 'default'}}
                                onClick={(e) => { 
                                    e.stopPropagation(); 
                                    if(i === 0 && points.length >= 3) onFinishDrawing();
                                }}
                            />
                        ))}
                    </React.Fragment>
                )}

                {/* EDGE LABELS (A, B, C, D... with lengths) */}
                {!isDrawing && points.length >= 3 && points.map((p, i) => {
                    const pNext = points[(i + 1) % points.length];
                    const screenMx = toScreenX((p.x + pNext.x) / 2);
                    const screenMy = toScreenY((p.y + pNext.y) / 2);
                    
                    const dx = pNext.x - p.x;
                    const dy = pNext.y - p.y;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    
                    if (len < 0.1) return null;

                    const nx = dy / len;
                    const ny = -dx / len;
                    
                    // Push the text outward slightly more to accommodate the text size
                    const offsetX = screenMx + nx * 22; 
                    const offsetY = screenMy - ny * 22; 
                    const letter = String.fromCharCode(65 + i);

                    return (
                        <g key={`edge-label-${i}`} style={{ pointerEvents: 'none' }}>
                            {/* White stroke outline for robust readability against any background */}
                            <text x={offsetX} y={offsetY} textAnchor="middle" dy="0.3em" fontSize="12" fontWeight="bold" stroke="white" strokeWidth="4" strokeLinejoin="round">
                                {letter}: {len.toFixed(2)}м
                            </text>
                            <text x={offsetX} y={offsetY} textAnchor="middle" dy="0.3em" fontSize="12" fontWeight="bold" fill="#334155">
                                {letter}: {len.toFixed(2)}м
                            </text>
                        </g>
                    );
                })}

                {/* MOVE LINES BEFORE POINTS SO POINTS ARE ON TOP */}
                {!isDrawing && points.length >= 3 && points.map((p, i) => {
                    const pNext = points[(i + 1) % points.length];
                    return ( 
                      <g key={`line-group-${i}`}>
                        {/* Invisible thicker line for easier clicking */}
                        <line 
                          x1={toScreenX(p.x)} y1={toScreenY(p.y)} 
                          x2={toScreenX(pNext.x)} y2={toScreenY(pNext.y)} 
                          stroke="transparent" 
                          strokeWidth="20" 
                          style={{cursor: 'crosshair'}} 
                          onClick={(e) => handleLineClick(i, e)}
                          className="group hover:stroke-indigo-400/30 transition-colors"
                        >
                          <title>Нажмите, чтобы добавить точку</title>
                        </line>
                        {/* Visible line */}
                        <line 
                          x1={toScreenX(p.x)} y1={toScreenY(p.y)} 
                          x2={toScreenX(pNext.x)} y2={toScreenY(pNext.y)} 
                          stroke="transparent" 
                          strokeWidth="2" 
                          pointerEvents="none"
                        />
                      </g>
                    );
                })}

                {/* POINTS RENDERED LAST TO BE ON TOP AND CLICKABLE */}
                {points.map((p, i) => (
                    <circle key={`pt-${i}`} cx={toScreenX(p.x)} cy={toScreenY(p.y)} r={6} fill="white" stroke="#ef4444" strokeWidth="2" style={{cursor: isDrawing ? 'default' : 'grab', transition: 'r 0.1s'}}
                            onMouseDown={(e) => { if(!isDrawing) { e.stopPropagation(); setDraggingPointIdx(i); } }} onDoubleClick={(e) => { handlePointDblClick(i, e); }}
                            onMouseEnter={(e) => e.target.setAttribute('r', 8)} onMouseLeave={(e) => e.target.setAttribute('r', 6)}
                            pointerEvents={isDrawing ? 'none' : 'auto'}
                    />
                ))}
            </svg>

            {isDrawing && (
                <div className="absolute bottom-10 left-1/2 -translate-x-1/2 bg-white p-3 rounded-xl shadow-2xl border border-indigo-200 flex items-center gap-4 z-50">
                    <span className="text-sm font-bold text-slate-700">Режим рисования ({points.length} точек)</span>
                    {points.length >= 3 && (
                        <button onClick={onFinishDrawing} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 transition flex items-center gap-2">

                               <button onClick={() => handleOffsetChange(-0.01)} className="bg-slate-100 border border-slate-400 rounded p-0.5 hover:bg-white flex justify-center" title="Сдвинуть вниз (-1 см)"><ChevronDown className="w-3 h-3 text-slate-700"/></button>

                      </div>
                      <div className="absolute top-6 bottom-1 right-0.5 w-1 bg-blue-700 rounded-full opacity-60 pointer-events-none"></div>
                  </div>
            )}
            
            <div className="sticky top-4 right-4 ml-auto w-fit flex flex-col gap-1 bg-white border border-slate-300 rounded shadow-sm mr-4 mt-4 print:hidden">
               <button onClick={() => setZoom(z => Math.min(3, z + 0.1))} className="p-1.5 hover:bg-slate-100"><ZoomIn className="w-4 h-4 text-slate-600"/></button>
               <button onClick={() => setZoom(z => Math.max(0.2, z - 0.1))} className="p-1.5 hover:bg-slate-100 border-t border-slate-200"><ZoomOut className="w-4 h-4 text-slate-600"/></button>
            </div>
        </div>

        <div className="bg-white border-t border-slate-300 p-2 text-[10px] font-sans text-slate-800 flex justify-between items-start shrink-0 z-50 relative shadow-[0_-4px_10px_rgba(0,0,0,0.05)] print:hidden">
            <div className="flex flex-col gap-0.5 w-1/3 border-r border-slate-200 pr-2">
                <div>Заказ №1301 от {new Date().toLocaleDateString('ru-RU')}</div>
                <div className="font-bold">Lmax реальная/Lmax стандартная, м: {(globalSettings?.lMax || 0).toFixed(3)} / 8.200</div>
                <div>Площадь Ската, кв.м: <span className="font-bold">{slopeGeomArea.toFixed(3)}</span></div>
                <div>Вертикаль смещен листов: 0 м</div>
                <div>Величина округления: {(globalSettings?.rounding || 0).toFixed(3)} м</div>
                <div>Карнизный свес (капельник): {activeS?.overhang || 0} м</div>
            </div>
            <div className="flex flex-col gap-0.5 w-1/3 border-r border-slate-200 px-2">
                <div className="font-bold">Скат № {activeS?.id || '-'}/{projectInfo?.totalSlopes || 1}</div>
                <div>Длина ската Lск, м: {activeS ? ((activeS?.h || 0) + (activeS?.overhang || 0)).toFixed(3) : '-'}</div>
                <div>Полезная/Полная площадь листов, кв.м: <span className="font-bold">{matAreaUseful.toFixed(3)} / {matAreaFull.toFixed(3)}</span></div>
                <div>Укладка 'Слева направо' / Горизонт смещен листов: {activeS?.layout?.offset ? (activeS.layout.offset / 100).toFixed(3) : '0.000'} м</div>
                <div>Учет невыполнимых размеров: {globalSettings?.useDeadZones ? 'Да' : 'Нет'}</div>
                <div>Процент отходов, %: <span className="font-bold text-red-600">{wastePercent.toFixed(2)}</span></div>
            </div>
            <div className="w-1/3 pl-2 flex flex-col justify-end h-full items-end text-slate-400">
                <div className="text-xl font-bold tracking-widest opacity-20">RoofPro</div>
            </div>
        </div>
    </div>
  );
});

// --- MAIN APP COMPONENT ---
const App = () => {
  const [slopes, setSlopes] = useState([]);
  const [activeSlopeId, setActiveSlopeId] = useState(null);
  const [materialType, setMaterialType] = useState('metal');
  const [activeProfileId, setActiveProfileId] = useState('alicante_new'); 
  const [isProfileSelectOpen, setIsProfileSelectOpen] = useState(false); 
  const [zoom, setZoom] = useState(1.0);
  const [viewMode, setViewMode] = useState('editor');
  const [showAI, setShowAI] = useState(false);
  const [showProject, setShowProject] = useState(true);
  const [showProjectInfo, setShowProjectInfo] = useState(false);
  const [presentationMode, setPresentationMode] = useState(false);
  const [showMaterialSettings, setShowMaterialSettings] = useState(false);
  const [showVerification, setShowVerification] = useState(false);
  const [pendingSlopes, setPendingSlopes] = useState([]);
  const [recognitionMeta, setRecognitionMeta] = useState(null);
  
  const [projectInfo, setProjectInfo] = useState({
      client: 'Иванов И.И.',
      address: 'г. Москва, ул. Ленина 1',
      date: new Date().toISOString().split('T')[0],
      phone: '+7 (999) 000-00-00',
      totalSlopes: 0
  });

  // Gemini AI State
  const [aiMessages, setAiMessages] = useState([{ role: 'assistant', text: 'Приветствую! Я ИИ-помощник RoofPro. Могу подсказать по раскладке или материалам.' }]);
  const [aiInput, setAiInput] = useState("");
  const [isAiLoading, setIsAiLoading] = useState(false);
  const [proposalText, setProposalText] = useState("");
  const [isProposalLoading, setIsProposalLoading] = useState(false);

  const chatEndRef = useRef(null);
  
  // GLOBAL SETTINGS STATE
  const [globalSettings, setGlobalSettings] = useState({
      lMax: 8.500,
      lMin: 0.500,
      rounding: 0.050,
      lockOverlap: 0.150,
      waveLength: 0.350,
      useDeadZones: true,
      customDeadZones: [] 
  });

  useEffect(() => { if (chatEndRef.current) { chatEndRef.current.scrollIntoView({ behavior: "smooth" }); } }, [aiMessages, showAI]);

  useEffect(() => {
    const profiles = PROFILES[materialType];
    if (profiles && profiles.length > 0) {
      if (activeProfileId === 'alicante_new' && materialType === 'metal') return;
      setActiveProfileId(profiles[0].id);
    }
  }, [materialType]);

  const material = useMemo(() => {
    const profileData = PROFILES[materialType]?.find(p => p.id === activeProfileId) || PROFILES[materialType]?.[0];
    if (!profileData) return { name: 'Unknown', effectiveWidth: 1, total: 1 };
    
    const deadZones = globalSettings.customDeadZones?.length > 0 
        ? globalSettings.customDeadZones 
        : (profileData.deadZones || []);

    return { 
        ...profileData, 
        effectiveWidth: profileData.effective, 
        name: `${MATERIAL_TYPES[materialType].name} ${profileData.name}`, 
        category: materialType, 
        deadZones: deadZones 
    };
  }, [materialType, activeProfileId, globalSettings.customDeadZones]);

  const activeS = slopes.find(s => s.id === activeSlopeId) || (slopes.length > 0 ? slopes[0] : null);
  const activeSheets = useMemo(() => (activeS && activeS.templateId !== 'custom_draw') ? MathUtils.calculateSlope(activeS, material, globalSettings) : [], [activeS, material, globalSettings]);

  const offsetLimit = Math.floor((material.effectiveWidth || 1) * 100);

  const handleCanvasClick = (x, y) => {
      if (!activeSlopeId) {
          const newId = slopes.length > 0 ? Math.max(...slopes.map(s => s.id)) + 1 : 1;
          setSlopes([...slopes, { 
              id: newId, name: `Скат ${newId}`, type: 'custom', templateId: 'custom_draw', 
              w1: 0, w2: 0, h: 0, h2: 0, points: [{x, y}], offsetLeft: 0, overhang: 0.05, d1: 0, d2: 0, 
              sheetOverrides: {}, layout: { mode: 'start', offset: 0 } 
          }]);
          setActiveSlopeId(newId);
          setProjectInfo(prev => ({...prev, totalSlopes: prev.totalSlopes + 1}));
      } else {
          setSlopes(prev => prev.map(s => {
              if (s.id !== activeSlopeId || s.templateId !== 'custom_draw') return s;
              const lastPt = s.points[s.points.length - 1];
              if (lastPt && Math.abs(lastPt.x - x) < 0.01 && Math.abs(lastPt.y - y) < 0.01) return s;
              return { ...s, points: [...s.points, {x, y}] };
          }));
      }
  };

  const handleFinishDrawing = () => {
      setSlopes(prev => prev.map(s => {
          if (s.id !== activeSlopeId) return s;
          if (s.points.length < 3) return s; 
          return { ...s, templateId: 'custom' };
      }));
  };

  const handleCancelDrawing = () => {
      removeSlope(activeSlopeId);
  };

  const updateSlope = (id, field, value) => {
    const valStr = String(value).replace(',', '.');
    const meters = parseFloat(valStr) || 0; 
    setSlopes(prev => prev.map(s => { 
        if (s.id !== id) return s; 
        const next = { ...s, [field]: meters };
        if (['w1', 'w2', 'h', 'h2'].includes(field)) {
            if (next.templateId !== 'custom') {
                next.points = MathUtils.generateTemplatePoints(next.templateId, next.w1, next.w2, next.h);
            }
        }
        return next; 
    }));
  };

  const handleUpdateSheetOverride = (slopeId, sheetIds, changes) => {
      const ids = Array.isArray(sheetIds) ? sheetIds : [sheetIds];

      setSlopes(prev => prev.map(s => {
          if (s.id !== slopeId) return s;
          const currentOverrides = { ...(s.sheetOverrides || {}) };
          
          ids.forEach(id => {
               currentOverrides[id] = { ...(currentOverrides[id] || {}), ...changes };
          });
          
          return { ...s, sheetOverrides: currentOverrides };
      }));
  };

  const updateSlopeGeometry = (id, newParams) => {
      setSlopes(prev => prev.map(s => { 
          if (s.id !== id) return s; 
          const round3 = (n) => Math.round(n * 1000) / 1000;
          let derived = {};
          if (newParams.points) {
              const pts = newParams.points;
              const dist = (p1, p2) => Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
              const ys = pts.map(p => p.y);
              derived.h = round3(Math.max(...ys) - Math.min(...ys));
              if (s.templateId === 'rhomb') { if (pts.length >= 3) derived.w1 = round3(Math.abs(pts[2].x - pts[0].x)); derived.w2 = 0; } 
              else if (s.templateId === 'tri' || s.templateId === 'tri_r' || s.templateId === 'tri_l') { if (pts.length >= 2) derived.w1 = round3(dist(pts[0], pts[1])); derived.w2 = 0; } 
              else { if (pts.length >= 2) derived.w1 = round3(dist(pts[0], pts[1])); if (pts.length >= 4) derived.w2 = round3(dist(pts[2], pts[3])); }
          }
          return { ...s, ...newParams, ...derived }; 
      }));
  };

  const addSlopeFromTemplate = (template) => {
    const newId = slopes.length > 0 ? Math.max(...slopes.map(s => s.id)) + 1 : 1;
    
    // START DRAWING MODE
    if (template.id === 'draw') {
        setSlopes([...slopes, { 
            id: newId, name: `Скат ${newId}`, type: 'custom', templateId: 'custom_draw', 
            w1: 0, w2: 0, h: 0, h2: 0, points: [], offsetLeft: 0, overhang: 0.05, d1: 0, d2: 0, 
            sheetOverrides: {}, layout: { mode: 'start', offset: 0 } 
        }]);
        setActiveSlopeId(newId);
        setProjectInfo(prev => ({...prev, totalSlopes: prev.totalSlopes + 1}));
        return;
    }
    
    setSelectedTemplate(template);
    setNewSlopeParams({
        w1: template.w1 || 0,
        w2: template.w2 || 0,
        h: template.h || 0,
        h2: template.h2 || 0,
        offsetLeft: template.offsetLeft || 0,
        overhang: 0.05
    });
    setShowTemplateModal(true);
  };

  const removeSlope = (id) => {
    const newSlopes = slopes.filter(s => s.id !== id);
    setSlopes(newSlopes);
    setProjectInfo(prev => ({...prev, totalSlopes: newSlopes.length}));
    if (activeSlopeId === id) { 
        setActiveSlopeId(newSlopes.length > 0 ? newSlopes[0].id : null); 
    }
  };
  
  const handlePrint = () => {
     setShowProject(false);
     setTimeout(() => { window.print(); }, 100);
  };
  
  const updateGlobalSetting = (key, value) => {
      const valStr = String(value).replace(',', '.');
      const num = parseFloat(valStr) || 0;
      setGlobalSettings(prev => ({...prev, [key]: num}));
  };

  const totals = useMemo(() => {
    let areaRoof = 0, areaMat = 0;
    const sheetBom = {}; 
    const slopesData = [];
    slopes.forEach(s => {
      const fullH = s.h + (s.overhang || 0);
      const slopeGeomArea = ((s.w1 + s.w2)/2) * fullH;
      areaRoof += slopeGeomArea;
      const sheets = MathUtils.calculateSlope(s, material, globalSettings); 
      let slopeMatAreaEffective = 0;
      let slopeMatAreaTotal = 0;
      sheets.forEach(sh => {
        const lenKey = (sh.len || 0).toFixed(3);
        if (!sheetBom[lenKey]) sheetBom[lenKey] = 0;
        sheetBom[lenKey]++;
        slopeMatAreaEffective += (sh.len || 0) * (material.effectiveWidth || 0);
        slopeMatAreaTotal += (sh.len || 0) * (material.total || 0);
      });
      areaMat += slopeMatAreaTotal;
      const slopeWaste = slopeGeomArea > 0 ? ((slopeMatAreaTotal - slopeGeomArea) / slopeGeomArea) * 100 : 0;
      slopesData.push({ id: s.id, name: s.name, len: fullH, areaGeom: slopeGeomArea, areaEffective: slopeMatAreaEffective, areaTotal: slopeMatAreaTotal, waste: slopeWaste });
    });
    const waste = areaRoof > 0 ? ((areaMat - areaRoof) / areaRoof) * 100 : 0;
    const totalSheetsCount = Object.values(sheetBom).reduce((a, b) => a + b, 0);
    const totalLinearMeters = Object.keys(sheetBom).reduce((acc, len) => acc + (parseFloat(len) * sheetBom[len]), 0);
    return { areaRoof, areaMat, waste, sheetBom, slopesData, totalSheetsCount, totalLinearMeters };
  }, [slopes, material, globalSettings]);

  const updatePendingSlope = (idx, field, value) => {
      const valStr = String(value).replace(',', '.');
      const meters = parseFloat(valStr) || 0;
      setPendingSlopes(prev => {
          const newSlopes = [...prev];
          newSlopes[idx] = { ...newSlopes[idx], [field]: meters };
          return newSlopes;
      });
  };

  const confirmRecognition = () => {
      const newSlopes = [...slopes];
      let maxId = slopes.length > 0 ? Math.max(...slopes.map(s => s.id)) : 0;
      
      pendingSlopes.forEach(ps => {
          maxId++;
          const w1 = ps.w1;
          const w2 = ps.w2 || 0;
          const h = ps.h;
          const points = MathUtils.generateTemplatePoints(ps.templateId, w1, w2, h);
          
          newSlopes.push({
              id: maxId,
              name: ps.name || `Скат ${maxId}`,
              type: ps.type,
              templateId: ps.templateId,
              w1, w2, h, h2: 0,
              points,
              offsetLeft: 0, overhang: 0.05, d1: 0, d2: 0,
              sheetOverrides: {}, layout: { mode: 'start', offset: 0 }
          });
      });
      
      setSlopes(newSlopes);
      setProjectInfo(prev => ({...prev, totalSlopes: newSlopes.length}));
      if (newSlopes.length > 0 && !activeSlopeId) {
          setActiveSlopeId(newSlopes[0].id);
      }
      setShowVerification(false);
      setPendingSlopes([]);
  };

  const handleGenerateDeadZones = ({ start, length, step, max }) => {
      const zones = [];
      let currentStart = start / 1000;
      const lenM = length / 1000;
      const stepM = step / 1000;
      const maxM = max / 1000;
      
      while (currentStart < maxM) {
          zones.push([currentStart, currentStart + lenM]);
          currentStart += stepM;
      }
      return zones;
  };

  const saveMaterialSettings = (zones) => {
      setGlobalSettings(prev => ({ ...prev, customDeadZones: zones }));
      setShowMaterialSettings(false);
  };

  const handleAskAI = (prompt) => {
      setAiInput(prompt);
      setShowAI(true);
  };

  const handleSendAiMessage = async () => {
    if (!aiInput.trim()) return;
    
    const newMessages = [...aiMessages, { role: 'user', text: aiInput }];
    setAiMessages(newMessages);
    setAiInput('');
    setIsAiLoading(true);

    const systemPrompt = `Вы опытный инженер-кровельщик и менеджер по продажам. Помогаете пользователю приложения RoofPro. 
    Текущий проект: Заказчик ${projectInfo.client}. 
    Выбранный материал: ${material.name}.
    Мертвые зоны реза материала: ${material.deadZones.map(z => `${z[0]}-${z[1]} м`).join(', ') || 'нет'}.
    Отвечайте кратко, профессионально и по делу.`;

    try {
        const response = await callGemini(newMessages[newMessages.length - 1].text, systemPrompt);
        setAiMessages([...newMessages, { role: 'assistant', text: response }]);
    } catch (error) {
        setAiMessages([...newMessages, { role: 'assistant', text: 'Ошибка соединения с ИИ. Проверьте API ключ или интернет.' }]);
    } finally {
        setIsAiLoading(false);
    }
  };

  const handleGenerateProposal = async () => {
    setIsProposalLoading(true);
    const prompt = `Сгенерируй красивое и убедительное коммерческое предложение для клиента (имя: ${projectInfo.client}).
    Мы предлагаем кровельный материал: ${material.name}.
    Площадь кровли по геометрии: ${totals.areaRoof.toFixed(2)} кв.м.
    Необходимая площадь материала с учетом нахлестов: ${totals.areaMat.toFixed(2)} кв.м.
    Общее количество листов: ${totals.totalSheetsCount} шт.
    Процент обрезков (отходов): ${totals.waste.toFixed(2)}%.
    Постарайся сделать текст продающим, обоснуй выбор материала (надежность, долговечность), упомяни, что расчет сделан профессионально в RoofPro. Добавь призыв к действию в конце. Форматируй текст абзацами.`;

    try {
        const response = await callGemini(prompt, "Ты лучший в мире менеджер по продажам кровельных систем. Твоя цель - убедить клиента.");
        setProposalText(response);
    } catch (error) {
        setProposalText("Не удалось сгенерировать коммерческое предложение.");
    } finally {
        setIsProposalLoading(false);
    }
  };

  // Modal State
  const [showTemplateModal, setShowTemplateModal] = useState(false);
  const [selectedTemplate, setSelectedTemplate] = useState(null);
  const [newSlopeParams, setNewSlopeParams] = useState({ w1: 0, w2: 0, h: 0, h2: 0, offsetLeft: 0, overhang: 0.05 });

  const initiateAddSlope = (template) => {
    if (template.id === 'draw') {
        addSlopeFromTemplate(template);
        return;
    }
    setSelectedTemplate(template);
    setNewSlopeParams({
        w1: template.w1 || 0,
        w2: template.w2 || 0,
        h: template.h || 0,
        h2: template.h2 || 0,
        offsetLeft: template.offsetLeft || 0,
        overhang: 0.05
    });
    setShowTemplateModal(true);
  };

  const confirmAddSlope = () => {
     if (!selectedTemplate) return;
     
     const { w1, w2, h, h2, offsetLeft, overhang } = newSlopeParams;
     const newId = slopes.length > 0 ? Math.max(...slopes.map(s => s.id)) + 1 : 1;
     
     const points = MathUtils.generateTemplatePoints(selectedTemplate.id, w1, w2, h, h2, offsetLeft);
     
     setSlopes([...slopes, { 
        id: newId, 
        name: `Скат ${newId}`, 
        type: selectedTemplate.type, 
        templateId: selectedTemplate.id, 
        w1, w2, h, h2, 
        points, 
        offsetLeft, 
        overhang, 
        d1: 0, d2: 0, 
        sheetOverrides: {},

                      <thead><tr className="border-b border-slate-300 bg-slate-50"><th className="py-2 px-2 text-left font-bold border-r border-slate-300">№ Ската</th><th className="py-2 px-2 text-center font-bold border-r border-slate-300">L Ската, м</th><th className="py-2 px-2 text-center font-bold border-r border-slate-300">S Ската, кв.м</th><th className="py-2 px-2 text-center font-bold border-r border-slate-300">Sполезная расчетная, кв.м</th><th className="py-2 px-2 text-center font-bold border-r border-slate-300">Sполная расчетная, кв.м</th><th className="py-2 px-2 text-right font-bold">Отходы, %</th></tr></thead>
                      <tbody>
                          {totals.slopesData.map((s, idx) => (<tr key={s.id} className="border-b border-slate-200"><td className="py-2 px-2 border-r border-slate-200">{idx + 1}</td><td className="py-2 px-2 text-center border-r border-slate-200">{(s.len || 0).toFixed(3)}</td><td className="py-2 px-2 text-center border-r border-slate-200">{(s.areaGeom || 0).toFixed(3)}</td><td className="py-2 px-2 text-center border-r border-slate-200">{(s.areaEffective || 0).toFixed(3)}</td><td className="py-2 px-2 text-center border-r border-slate-200">{(s.areaTotal || 0).toFixed(3)}</td><td className="py-2 px-2 text-right">{(s.waste || 0).toFixed(2)}</td></tr>))}
                          <tr className="font-bold border-t-2 border-slate-800 bg-slate-50"><td className="py-2 px-2 border-r border-slate-300">Всего:</td><td className="py-2 px-2 text-center border-r border-slate-300"></td><td className="py-2 px-2 text-center border-r border-slate-300">{(totals.areaRoof || 0).toFixed(3)}</td><td className="py-2 px-2 text-center border-r border-slate-300">{(totals.areaMat * (material.effectiveWidth/material.total) || 0).toFixed(3)}</td><td className="py-2 px-2 text-center border-r border-slate-300">{(totals.areaMat || 0).toFixed(3)}</td><td className="py-2 px-2 text-right">{(totals.waste || 0).toFixed(2)}</td></tr>
                      </tbody>
                  </table>
                  <div className="flex justify-between items-start mb-6"><div className="text-[10px] space-y-1"><div className="font-bold uppercase mb-2">РАССЧИТАННЫЕ ЛИСТЫ НА ЗАКАЗ:</div>{Object.keys(totals.sheetBom).sort((a,b) => b-a).map((len) => (<div key={len} className="grid grid-cols-[100px_1fr] gap-4"><span>Длина, м: <span className="font-bold">{parseFloat(len).toFixed(3)}</span></span><span>Кол-во, шт.: <span className="font-bold">{totals.sheetBom[len]}</span></span></div>))}<div className="mt-4 font-bold">Погонных метров: {(totals.totalLinearMeters || 0).toFixed(3)}</div></div><button onClick={handlePrint} className="text-[10px] border border-slate-300 px-3 py-1 bg-slate-100 hover:bg-slate-200 transition print:hidden flex items-center gap-1 font-bold rounded-lg shadow-sm"><Printer className="w-3 h-3"/> Печать / PDF</button></div>
                  
                  {/* GEMINI PROPOSAL SECTION */}
                  <div className="mt-8 border-t border-slate-200 pt-6 print:block">
                      <div className="flex items-center justify-between mb-4 print:hidden">
                          <h3 className="font-bold text-slate-800 flex items-center gap-2"><Sparkles className="w-4 h-4 text-indigo-500" /> Умное коммерческое предложение</h3>
                          <button onClick={handleGenerateProposal} disabled={isProposalLoading} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-[10px] font-bold transition-all flex items-center gap-2 disabled:opacity-50">
                              {isProposalLoading ? <Loader2 className="w-3 h-3 animate-spin" /> : <Sparkles className="w-3 h-3 text-yellow-300" />} 
                              Сгенерировать текст (AI)
                          </button>
                      </div>
                      
                      {proposalText && (
                          <div className="bg-indigo-50/50 p-6 rounded-xl border border-indigo-100 text-xs text-slate-700 whitespace-pre-wrap leading-relaxed shadow-inner">
                              {proposalText}
                          </div>
                      )}
                  </div>

                  <div className="flex justify-between items-end mt-12 pt-10 text-[10px]"><div>Менеджер</div><div className="w-40 border-b border-slate-400"></div><div>Яндиев А. М.</div></div>
               </div>
            </div>
         )}
      </div>

      {/* NEW TEMPLATE MODAL */}
      {showTemplateModal && selectedTemplate && (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm flex flex-col transform transition-all scale-100 border border-white/20">
                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/80 rounded-t-2xl">
                    <div className="flex items-center gap-2">
                        <div className="w-6 h-6 text-indigo-600">
                            <selectedTemplate.icon />
                        </div>
                        <h3 className="text-sm font-bold text-slate-800">{selectedTemplate.name}</h3>
                    </div>
                    <button onClick={() => setShowTemplateModal(false)} className="text-slate-400 hover:text-slate-600"><X className="w-4 h-4"/></button>
                </div>
                <div className="p-6 space-y-4">
                     <ModernInput label="Ширина 1 (Основание)" value={newSlopeParams.w1} onChange={(v) => setNewSlopeParams({...newSlopeParams, w1: parseFloat(v)||0})} suffix="м" autoFocus />
                     
                     <ModernInput label="Высота (Длина ската)" value={newSlopeParams.h} onChange={(v) => setNewSlopeParams({...newSlopeParams, h: parseFloat(v)||0})} suffix="м" />
                     
                     {(selectedTemplate.type === 'trapezoid' || ['l_shape_bl', 'l_shape_br', 'l_shape_tl', 'l_shape_tr', 't_shape', 'cut_tl', 'cut_tr', 'rect_cut_br'].includes(selectedTemplate.id)) && (
                        <ModernInput label="Ширина 2 (Верх/Вырез)" value={newSlopeParams.w2} onChange={(v) => setNewSlopeParams({...newSlopeParams, w2: parseFloat(v)||0})} suffix="м" />
                     )}
                     
                     {['l_shape_bl', 'l_shape_br', 'l_shape_tl', 'l_shape_tr', 't_shape', 'house', 'rhomb', 'cut_tl', 'cut_tr', 'rect_cut_br'].includes(selectedTemplate.id) && (
                        <ModernInput label="Высота 2 (Вырез/Сдвиг)" value={newSlopeParams.h2} onChange={(v) => setNewSlopeParams({...newSlopeParams, h2: parseFloat(v)||0})} suffix="м" />
                     )}

                     {['paral_l', 'paral_r', 'rhomb'].includes(selectedTemplate.id) && (
                        <ModernInput label="Сдвиг (Offset)" value={newSlopeParams.offsetLeft} onChange={(v) => setNewSlopeParams({...newSlopeParams, offsetLeft: parseFloat(v)||0})} suffix="м" />
                     )}

                     <ModernInput label="Карнизный свес" value={newSlopeParams.overhang} onChange={(v) => setNewSlopeParams({...newSlopeParams, overhang: parseFloat(v)||0})} suffix="м" />
                </div>
                <div className="p-4 border-t border-slate-100 flex justify-end gap-2 bg-white rounded-b-2xl">
                    <button onClick={() => setShowTemplateModal(false)} className="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg text-xs font-bold transition">Отмена</button>
                    <button onClick={confirmAddSlope} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold transition shadow-md shadow-indigo-200">Добавить скат</button>
                </div>
            </div>
        </div>
      )}
    </div>
  );
};

// --- BOOTSTRAP ---
const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(<App />);

</script>
</body>
</html>
